# AI 聊天室 — agent 注册表
# 每个 entry 定义一个"适配器":如何调用一种 CLI。
# 房间里的"成员"= 适配器 + 人设/立场 prompt + 显示名(运行期可任意多实例)。
# 认证:各 CLI 需先自行登录(claude login / codex login / gemini OAuth 或 API key / qwen /auth);
#       网络需代理时设 HTTPS_PROXY 环境变量后启动本服务(Node fetch 不读系统代理)。

adapters:
  claude:
    displayName: Claude Code
    kind: claude            # 对应 src/adapters/claude.ts 的解析器
    command: claude
    args:
      - -p                  # prompt 走 stdin(多行安全,见 src/adapters/proc.ts)
      - --output-format
      - stream-json
      - --verbose

  codex:
    displayName: Codex CLI
    kind: codex
    command: codex
    args:
      - exec
      - --json              # JSONL 事件流(实测 v0.153.4)
      - --skip-git-repo-check  # 隔离 cwd 不是 git 仓库,不跳过则拒跑
      - -                   # 从 stdin 读 prompt
      # sandbox 档位由适配器按房间 toolPermission 统一翻译(--sandbox read-only 等),勿在此重复传

  gemini:
    displayName: Gemini CLI
    kind: gemini
    command: gemini
    args:
      - --output-format
      - stream-json         # JSONL 事件流(实测 v0.58.0)
      # prompt 从 stdin 读;resume 由适配器拼 --resume <id>
      # 认证:~/.gemini/.env 的 GEMINI_API_KEY 或交互登录一次

  qwen:
    displayName: Qwen Code
    kind: qwen
    command: qwen
    args:
      - --output-format
      - stream-json         # JSONL 事件流(实测 v0.15.10,事件为自有 schema)
      # 认证与模型在 qwen 自身配置(~/.qwen/settings.json,不进仓库):
      #   modelProviders.openai 指向 DeepSeek(env.OPENAI_API_KEY 存 key)+ model.name 持久选中
      #   ——server 零 key 零环境变量依赖,spawn 即用
      # prompt 从 stdin 读;resume 由适配器拼 --resume <id>

# 侦察员(Scout):绑定项目的房间,首棒前自动跑一次只读项目分析,全员共享。
scout:
  adapter: claude           # 用哪个适配器跑侦察
  model: haiku              # 便宜档模型参数(注入 --model)
  allowedTools: 'Read Glob Grep'
  timeoutMs: 180000         # 超时(超时即取消进程,不泄漏)
  maxRetries: 2             # 失败熔断:连续失败 N 次后本房间生命周期内不再重试

# 上下文压缩层(Summary & Compact):长程讨论与私聊自总结
summary:
  model: haiku              # 摘要与 compact 用的经济模型
  autoThreshold: 30         # 公聊消息自动触发阈值(0为关闭)
  privateThreshold: 20      # 私聊消息自动触发纪要阈值(0为关闭)
  compactThreshold: 40      # stateful 成员自动 compact 阈值(0为关闭)

server:
  port: 3220
  host: 127.0.0.1
